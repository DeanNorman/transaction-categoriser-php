# The whole system on a laptop: MariaDB, PHP-FPM, nginx.
#
#   docker compose up -d --build                     builds the PHP image and starts the stack
#   curl -s localhost:8090/health                    -> {"data":{"status":"ok","database":"ok"}}
#   open http://localhost:8090                       the front-end page
#   docker compose run --rm php vendor/bin/phpunit   unit + integration tests, inside the stack
#   docker compose down -v                           throw it all away, including the database
#
# Nothing here is a production value.

name: transaction-categoriser-php

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: transactions
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: transactions
      DB_USER: app
      DB_PASSWORD: app
      TEST_DB_NAME: transactions_test   # the integration suite writes here, never to DB_NAME
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db-data:
